name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle 8.7 itself, so no gradle-wrapper.jar is needed in the repo
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build offline APKs (no permissions)
        run: gradle assembleOfflineDebug assembleOfflineRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: simple-tv-launcher-apk
          path: app/build/outputs/apk/offline/**/*.apk
